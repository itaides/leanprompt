name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ts and rust versions must match
        run: |
          TS_VERSION=$(jq -r .version ts/package.json)
          RUST_VERSION=$(grep -m1 '^version = ' rust/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "ts=$TS_VERSION rust=$RUST_VERSION"
          if [ "$TS_VERSION" != "$RUST_VERSION" ]; then
            echo "::error::ts/package.json version ($TS_VERSION) and rust/Cargo.toml version ($RUST_VERSION) differ — both claim byte-identical behavior and must ship the same version number. Go has no manifest version field; keep its release tag (go/vX.Y.Z) in step manually."
            exit 1
          fi

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Type check
        run: bun x tsc --noEmit
      - name: Test
        run: bun test
      - name: Parity vectors are current
        run: |
          bun scripts/gen-parity.ts
          git diff --exit-code ../parity/

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (includes golden-vector parity)
        run: cargo test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (includes golden-vector parity)
        run: go test ./...
